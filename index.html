<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>하이랄 두더지 잡기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <header class="hud">
      <div class="hud-item">
        <span class="label">RUPEES</span>
        <span class="value"><span class="rupee"></span><span id="score">0</span></span>
      </div>
      <div class="hud-item">
        <span class="label">TIME</span>
        <span class="value" id="time">30</span>
      </div>
      <div class="hud-item">
        <span class="label">LIFE</span>
        <span class="value hearts" id="hearts">♥♥♥</span>
      </div>
      <div class="hud-item">
        <span class="label">BEST</span>
        <span class="value" id="best">0</span>
      </div>
    </header>

    <main class="board-wrap">
      <h1 class="title"><span class="triforce"></span>하이랄 두더지 잡기<span class="triforce"></span></h1>
      <p class="subtitle" id="status-line">두더지(모블린)를 잡아 루피를 모으세요! 폭탄은 피하세요!</p>

      <div class="board" id="board">
        <!-- 9 holes generated by JS -->
      </div>

      <div class="controls">
        <button class="btn" id="start-btn">▶ 모험 시작</button>
        <button class="btn btn-secondary" id="sound-btn" aria-label="sound toggle">🔊 소리</button>
      </div>
      <p class="db-status" id="db-status"></p>
    </main>

    <section class="panels">
      <div class="panel">
        <h2>▶ 용사의 전당 (TOP 10)</h2>
        <ol class="leaderboard" id="leaderboard"><li class="muted">불러오는 중...</li></ol>
      </div>

      <div class="panel">
        <h2>▶ 모험가의 리뷰</h2>
        <form id="review-form" class="review-form">
          <input type="text" id="review-name" placeholder="이름" maxlength="20" required />
          <div class="stars" id="stars" role="radiogroup" aria-label="별점">
            <button type="button" data-v="1">★</button>
            <button type="button" data-v="2">★</button>
            <button type="button" data-v="3">★</button>
            <button type="button" data-v="4">★</button>
            <button type="button" data-v="5">★</button>
          </div>
          <input type="hidden" id="review-rating" value="5" />
          <textarea id="review-comment" placeholder="게임은 어떠셨나요?" maxlength="300" rows="3" required></textarea>
          <button class="btn" type="submit">리뷰 남기기</button>
        </form>
        <ul class="reviews" id="reviews"><li class="muted">불러오는 중...</li></ul>
      </div>
    </section>
  </div>

  <!-- Game over dialog -->
  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <h2>GAME OVER</h2>
      <p>획득 루피: <strong id="final-score">0</strong></p>
      <form id="score-form">
        <input type="text" id="player-name" placeholder="용사의 이름" maxlength="20" required />
        <div class="modal-actions">
          <button class="btn" type="submit">점수 기록</button>
          <button class="btn btn-secondary" type="button" id="skip-btn">건너뛰기</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="game.js"></script>
</body>
</html>
